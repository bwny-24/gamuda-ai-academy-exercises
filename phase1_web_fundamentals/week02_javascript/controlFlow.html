<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Flow</title>
  </head>
  <body>
    <h1>Control Flow</h1>
    <!-- Everything passed to console.log also shows up here -->
    <pre id="output"></pre>

    <script>
      // Make console.log print on the page as well as in the DevTools console
      const output = document.getElementById("output");
      const originalLog = console.log;
      console.log = (...args) => {
        originalLog(...args);
        output.textContent += args.join(" ") + "\n";
      };

      // IF / ELSE IF / ELSE
      let number1, number2;
      number1 = Number(prompt("a number: "));
      number2 = Number(prompt("2nd number: "));

      if (number1 > number2) {
        console.log(`${number1} is bigger than ${number2}`);
      } else if (number1 === number2) {
        console.log(`${number2} is equal to ${number1}`);
      } else {
        console.log(`${number2} is bigger than ${number1}`);
      }

      // SWITCH USING NUMBERS
      let tires = Number(prompt("Enter no of tires : "));

      switch (tires) {
        case 1:
          console.log("issa 1 wheel motorcycle");
          break;
        case 2:
          console.log("issa motorcycle");
          break;
        case 3:
          console.log("issa tricycle");
          break;
        case 4:
          console.log("issa car");
          break;
        case 5:
        default:
          console.log("No vehicle has that many tires");
          break;
      }

      // SWITCH USING WORDS
      let person = String(prompt("Name a person:"));

      switch (person) {
        case "Benny":
          console.log("Hensem");
          break;
        case "Lebron":
          console.log("GOAT");
          break;
        default:
          console.log("gay");
          break;
      }

      // FOR LOOP
      let myArray = [4, 5, 6, 10, 12];
      let total = 0;

      for (let i = 0; i < myArray.length; i++) {
        total += myArray[i];
      }

      console.log(total);

      // FUNCTION
      function printName(myName) {
        console.log("My name is " + myName);
      }

      printName("Jacky");

      // ARROW FUNCTIONS
      let greet = () => "Good Morning";
      let message = greet();
      console.log(message);

      let addition = (num1, num2) => num1 + num2;
      let calcResult = addition(5, 6);
      console.log(calcResult);

      // TERNARY
      let num = 12;
      let checkEven =
        num % 2 === 0 ? () => console.log("Even") : () => console.log("Odd");

      checkEven();
    </script>
  </body>
</html>
