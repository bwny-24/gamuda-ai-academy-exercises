<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Translator</title>
  <style>
    body { font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif, 'Times New Roman', Times, serif, sans-serif; margin: 40px; }
    .container { max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; gap: 15px; }
    .field { flex: 1; display: flex; flex-direction: column; }
    textarea { height: 120px; resize: none; }
    button { padding: 12px; background-color: #1967d2; color: white; border: none; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Text Translator</h2>

    <!-- Language Selectors -->
    <div class="row">
      <div class="field">
        <label for="inputLang">Input Language</label>
        <select id="inputLang">
          <option value="English">English</option>
          <option value="German">German</option>
          <option value="Malay">Malay</option>
          <option value="Chinese">Chinese</option>
        </select>
      </div>

      <div class="field">
        <label for="outputLang">Output Language</label>
        <select id="outputLang">
          <option value="German">German</option>
          <option value="English">English</option>
          <option value="Malay">Malay</option>
          <option value="Chinese">Chinese</option>
        </select>
      </div>
    </div>

    <!-- Text Areas -->
    <div class="row">
      <div class="field">
        <label for="textInput">Enter text to translate</label>
        <textarea id="textInput" placeholder="Type here..."></textarea>
      </div>

      <div class="field">
        <label for="translationOutput">Translation</label>
        <textarea id="translationOutput" readonly placeholder="Translation will appear here..."></textarea>
      </div>
    </div>

    <!-- Submit Button -->
    <button onclick="translateText()">TRANSLATE</button>
  </div>

  <script>
    async function translateText() {
  const inputLang = document.getElementById("inputLang").value;
  const outputLang = document.getElementById("outputLang").value;
  const textInput = document.getElementById("textInput").value;
  const outputBox = document.getElementById("translationOutput");

  if (!textInput.trim()) {
    alert("Please enter text to translate!");
    return;
  }

  outputBox.value = "Translating...";

  try {
    const response = await fetch("http://127.0.0.1:8000/translate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        input_language: inputLang,
        output_language: outputLang,
        text_input: textInput
      })
    });

    if (!response.ok) {
      throw new Error(`Server error: ${response.status}`);
    }

    const data = await response.json();
    // Update the output box with the returned translation key
    outputBox.value = data.translated_text;

  } catch (error) {
    console.error("Translation error:", error);
    outputBox.value = "Failed to translate. Make sure FastAPI server is running.";
  }
}
  </script>
</body>
</html>
